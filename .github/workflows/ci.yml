name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  resources:
    name: Resource and reference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check references
        run: python3 tools/check_resources.py

  settings:
    name: Generated settings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate resources
        run: python3 tools/gen_settings.py
      - name: Fail on drift
        run: git diff --exit-code resources

  series:
    name: Watchface series files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check generated files and setting keys
        run: python3 series/tools/series.py --check
